name: PTJ Package A ONE isolated Windows acceptance DEMO
# One user-authorized candidate build from the isolated PUBLIC feature branch.
# 2026-11-20: user explicitly requested prompt Package A DEMO delivery; this
# workflow-only text update triggers ONE isolated candidate after exact-code CI
# PASS (run 44735624897); Windows installed acceptance remains OPEN.
# Trigger only when this workflow file changes; docs and product commits do not
# create new installers. No merge and no install into any user's data profile.
on:
  push:
    branches:
      - release/ptj-package-a-isolated-acceptance-2026-11-18
      - feature/ptj-package-a-cohesive-validation-repair-2026-11-18
    paths:
      - .github/workflows/ptj-package-a-acceptance-installer.yml

permissions:
  contents: read

jobs:
  package-a-isolated-demo:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install locked frontend dependencies
        run: npm ci
      # Targeted frontend and native checks already passed on the unchanged
      # application source in GitHub Actions run 44445624793; avoid repeating
      # those prior-successful suites just to create the installer.
      - name: Verify TypeScript and production UI build
        run: npm run build
      - name: Verify Package A independent app identity and database root
        run: node scripts/verify-packagea-isolation.mjs

      - name: Reproduce the previously approved desktop icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python scripts/build-approved-icon.py

      - name: Check isolated overlay and approved installer icon
        shell: pwsh
        run: |
          $base = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $overlay = Get-Content src-tauri/tauri.packagea.conf.json -Raw | ConvertFrom-Json
          if ($overlay.identifier -ne 'com.personaltradingjournal.desktop.demo.packagea.acceptance') { throw 'Wrong Package A data profile' }
          if ($base.identifier -eq $overlay.identifier) { throw 'Would overwrite production identity' }
          if ($base.bundle.icon -notcontains 'icons/icon.ico') { throw 'Approved executable icon missing' }
          if ($base.bundle.windows.nsis.installerIcon -ne 'icons/icon.ico') { throw 'Approved NSIS installer icon missing' }

      - name: Build ONE new isolated Package A Windows NSIS installer
        run: npm run tauri build -- --config src-tauri/tauri.packagea.conf.json --bundles nsis

      - name: Verify exactly one Package A EXE and print hash, path and byte length
        shell: pwsh
        run: |
          $files = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' -ErrorAction SilentlyContinue)
          if ($files.Count -ne 1) { throw "Expected one installer, found $($files.Count)" }
          if ($files[0].Name -notmatch 'Package A DEMO') { throw "Wrong installer name: $($files[0].Name)" }
          Write-Output "VerifiedFilename: $($files[0].Name)"
          Write-Output "VerifiedBytes: $($files[0].Length)"
          Get-FileHash -Path $files[0].FullName -Algorithm SHA256 | Format-List

      - name: Preserve uninstalled acceptance candidate only
        uses: actions/upload-artifact@v4
        with:
          name: PTJ-PACKAGE-A-ISOLATED-WINDOWS-DEMO-UNTESTED
          path: app/src-tauri/target/release/bundle/nsis/*Package A DEMO*.exe
          if-no-files-found: error
          retention-days: 7
