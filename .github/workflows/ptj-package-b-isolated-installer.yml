name: PTJ Package B ONE isolated Windows candidate DEMO
# ONE cohesive output candidate. Never builds on ordinary source/doc changes.
# CI and installed Windows acceptance remain separate verification gates.
on:
  push:
    branches:
      - feature/ptj-package-b-execution-risk-review-2026-11-21
    paths:
      - .github/workflows/ptj-package-b-isolated-installer.yml

permissions:
  contents: read

jobs:
  package-b-isolated-demo:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install locked frontend dependencies
        run: npm ci
      - name: Verify exact-source TypeScript and production frontend
        run: npm run build
      - name: Verify Package B unique data profile before bundling
        run: node scripts/verify-packageb-isolation.mjs

      - name: Reproduce previously approved icon locally on isolated runner
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python scripts/build-approved-icon.py

      - name: Confirm B overlay cannot reuse production or earlier DEMO
        shell: pwsh
        run: |
          $base = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $overlay = Get-Content src-tauri/tauri.packageb.conf.json -Raw | ConvertFrom-Json
          if ($overlay.identifier -ne 'com.personaltradingjournal.desktop.demo.packageb.acceptance') { throw 'Wrong Package B data profile' }
          if ($base.identifier -eq $overlay.identifier) { throw 'Would overwrite production identity' }
          if ($base.bundle.icon -notcontains 'icons/icon.ico') { throw 'Approved executable icon missing' }
          if ($base.bundle.windows.nsis.installerIcon -ne 'icons/icon.ico') { throw 'Approved NSIS installer icon missing' }

      - name: Build ONE isolated Package B Windows NSIS candidate
        run: npm run tauri build -- --config src-tauri/tauri.packageb.conf.json --bundles nsis

      - name: Verify exactly one Package B EXE and print SHA256 and size
        shell: pwsh
        run: |
          $files = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' -ErrorAction SilentlyContinue)
          if ($files.Count -ne 1) { throw "Expected one installer, found $($files.Count)" }
          if ($files[0].Name -notmatch 'Package B DEMO') { throw "Wrong installer name: $($files[0].Name)" }
          Write-Output "VerifiedFilename: $($files[0].Name)"
          Write-Output "VerifiedBytes: $($files[0].Length)"
          Get-FileHash -Path $files[0].FullName -Algorithm SHA256 | Format-List

      - name: Preserve isolated uninstalled artifact only
        uses: actions/upload-artifact@v4
        with:
          name: PTJ-PACKAGE-B-ISOLATED-WINDOWS-DEMO-UNTESTED
          path: app/src-tauri/target/release/bundle/nsis/*Package B DEMO*.exe
          if-no-files-found: error
          retention-days: 7
