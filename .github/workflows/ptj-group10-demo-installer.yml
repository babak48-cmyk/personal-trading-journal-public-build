name: PTJ Group 10 versioned Setup Playbook isolated NSIS (release gate)
# One user-authorized cohesive Group 10 acceptance DEMO. No migration or
# installer on the previously accepted production/Package B/Package C paths.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  group10-demo:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify new Group 10 data isolation before compile
        run: node scripts/verify-group10-isolation.mjs
      - name: Regenerate the already user-approved Windows icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python scripts/build-approved-icon.py
      - name: Check approved icon and new isolated desktop identity
        shell: pwsh
        run: |
          $base = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $old = Get-Content src-tauri/tauri.packagec.conf.json -Raw | ConvertFrom-Json
          $new = Get-Content src-tauri/tauri.group10.conf.json -Raw | ConvertFrom-Json
          if ($new.identifier -eq $old.identifier -or $new.identifier -eq $base.identifier) { throw 'Unsafe reused app identity' }
          if ($new.identifier -ne 'com.personaltradingjournal.desktop.demo.group10') { throw 'Unknown Group 10 app-data identity' }
          if ($base.bundle.icon -notcontains 'icons/icon.ico') { throw 'Missing user-approved ICO' }
          if ($base.bundle.windows.nsis.installerIcon -ne 'icons/icon.ico') { throw 'Missing user-approved NSIS icon' }
      - name: Build one new Group 10 ISOLATED DEMO installer
        run: npm run tauri build -- --config src-tauri/tauri.group10.conf.json --bundles nsis
      - name: Verify installer and report EXE SHA256
        shell: pwsh
        run: |
          $files = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' -ErrorAction SilentlyContinue)
          if ($files.Count -ne 1) { throw "Exactly one installer required. Found $($files.Count)" }
          if ($files[0].Name -notmatch 'Group 10 DEMO') { throw "Wrong installer: $($files[0].Name)" }
          Get-FileHash -Path $files[0].FullName -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: PTJ-GROUP10-ISOLATED-DEMO-UNTESTED
          path: app/src-tauri/target/release/bundle/nsis/*Group 10 DEMO*.exe
          if-no-files-found: error
          retention-days: 7
