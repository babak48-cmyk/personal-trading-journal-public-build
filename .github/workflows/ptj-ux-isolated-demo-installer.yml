name: PTJ UX DEMO standalone installer (preserve older versions)
# ONLY public development branch. Distinct app identifier ensures UX DEMO will not
# overwrite original installation or accepted baseline DEMO profile.
on:
  workflow_dispatch:
  push:
    branches:
      - feature/evidence-field-manager-cohesive-2026-11-13
    paths:
      - .github/workflows/ptj-ux-isolated-demo-installer.yml
permissions:
  contents: read
jobs:
  ux-demo-installer:
    if: github.ref == 'refs/heads/feature/evidence-field-manager-cohesive-2026-11-13'
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Report exact selected source
        shell: pwsh
        run: |
          Write-Host "Branch: ${{ github.ref }}"
          Write-Host "Source commit: ${{ github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/verify-demo-config.mjs
      - name: Verify new UX installer will not replace original or baseline
        run: node scripts/verify-ux-demo-config.mjs
      - name: Rebuild approved Windows icon (unchanged artwork)
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python scripts/build-approved-icon.py
      - name: Verify configured installer icon
        shell: pwsh
        run: |
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if (!(Test-Path src-tauri/icons/icon.ico)) { throw 'Approved icon missing' }
          if ($config.bundle.windows.nsis.installerIcon -ne 'icons/icon.ico') { throw 'Unexpected installer icon' }
      - name: Build UX DEMO only (unique identifier / independent profile)
        run: npm run tauri build -- --config src-tauri/tauri.ux-demo.conf.json --bundles nsis
      - name: Verify installer output and record SHA-256 provenance
        shell: pwsh
        run: |
          $files = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' -ErrorAction SilentlyContinue | Where-Object { $_.Name -match 'UX DEMO' })
          if ($files.Count -ne 1) { throw "Expected exactly one UX DEMO installer. Found: $($files.Count)" }
          $hash = (Get-FileHash -Path $files[0].FullName -Algorithm SHA256).Hash
          @(
            'PRODUCT=Personal Trading Journal UX DEMO'
            'IDENTIFIER=com.personaltradingjournal.desktop.uxdemo'
            'STATUS=CI-BUILT; WINDOWS-INSTALLED-UNTESTED'
            "GIT_SHA=${{ github.sha }}"
            "INSTALLER=$($files[0].Name)"
            "SHA256=$hash"
            "BYTES=$($files[0].Length)"
          ) | Set-Content -Path ux-demo-build-manifest.txt -Encoding UTF8
          Get-Content ux-demo-build-manifest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PTJ-UX-DEMO-STANDALONE-UNTESTED
          path: |
            app/src-tauri/target/release/bundle/nsis/*UX*DEMO*.exe
            app/ux-demo-build-manifest.txt
          if-no-files-found: error
          retention-days: 14
