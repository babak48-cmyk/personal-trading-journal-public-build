name: PTJ manual checks
on:
  workflow_dispatch:
  push:
    branches:
      - feature/package-a-evidence-decision-completion-2026-11-06
      - feature/ptj-package-a-cohesive-validation-repair-2026-11-18
      - feature/ptj-package-b-execution-risk-review-2026-11-21
    paths:
      - 'app/**'
      - '.github/workflows/ptj-manual-checks.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'app/**'
      - '.github/workflows/ptj-manual-checks.yml'
concurrency:
  group: ptj-manual-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Full frontend regression suite — cohesive Package A closure gate
        run: npm test
      - run: npm run build
      - run: node scripts/verify-demo-config.mjs
      - run: node scripts/verify-packageb-isolation.mjs
  rust:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Prepare Tauri frontendDist for cargo check
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: Resolve QW-1A Rust dependency lockfile (isolated runner only)
        working-directory: app/src-tauri
        run: cargo check
      - name: Verify Rust source with locked dependencies
        working-directory: app/src-tauri
        run: cargo check --locked
      - name: Targeted Package A native custom-field lifecycle regression tests
        working-directory: app/src-tauri
        run: 'cargo test --locked --lib custom_fields::tests::'
      - name: Native SQLite Evidence and Decision package regression tests
        working-directory: app/src-tauri
        run: |
          cargo test --locked --lib evidence_atomic_batch_tests::
          cargo test --locked --lib decision_mismatch_persistence_tests::
      - name: Native Field Manager requirement and Custom Field presentation integrity
        working-directory: app/src-tauri
        run: |
          cargo test --locked --lib field_requirement_override_guard_tests::
          cargo test --locked --lib custom_presentation::tests::
      - name: Complete native Rust library regression suite — Package A integrated gate
        working-directory: app/src-tauri
        run: cargo test --locked --lib

  # One cohesive isolated Package C release candidate on the authorized PR.
  package-c-demo:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/ptj-c-transfer-integrity-2026-11-23'
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/verify-package-c-isolation.mjs
      - name: Generate only the previously user-approved Windows icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python scripts/build-approved-icon.py
      - name: Check approved icon and distinct Package C product identity
        shell: pwsh
        run: |
          $base = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $demo = Get-Content src-tauri/tauri.demo.conf.json -Raw | ConvertFrom-Json
          $package = Get-Content src-tauri/tauri.packagec.conf.json -Raw | ConvertFrom-Json
          if ($base.identifier -eq $package.identifier -or $demo.identifier -eq $package.identifier) { throw 'Unsafe shared Package C app identity' }
          if ($package.identifier -ne 'com.personaltradingjournal.desktop.demo.packagec') { throw 'Unexpected Package C data path identity' }
          if ($base.bundle.icon -notcontains 'icons/icon.ico') { throw 'Approved executable icon not configured' }
          if ($base.bundle.windows.nsis.installerIcon -ne 'icons/icon.ico') { throw 'Approved installer icon not configured' }
      - name: Build entirely separate Package C DEMO (not a production install)
        run: npm run tauri build -- --config src-tauri/tauri.packagec.conf.json --bundles nsis
      - name: Verify the exact separate NSIS installer name and hash
        shell: pwsh
        run: |
          $files = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' -ErrorAction SilentlyContinue)
          if ($files.Count -ne 1) { throw "Expected exactly ONE Package C installer; got $($files.Count)" }
          if ($files[0].Name -notmatch 'Package C DEMO') { throw "Not the isolated Package C installer: $($files[0].Name)" }
          Get-FileHash -Path $files[0].FullName -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: PTJ-PACKAGE-C-ISOLATED-DEMO-UNTESTED
          path: app/src-tauri/target/release/bundle/nsis/*Package C DEMO*.exe
          if-no-files-found: error
          retention-days: 7
