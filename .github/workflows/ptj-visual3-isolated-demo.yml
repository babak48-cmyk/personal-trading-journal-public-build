name: PTJ three visual templates ONE isolated Windows DEMO
# Workflow-only push trigger: exactly one candidate build; never runs on
# routine source or documentation updates. Build does not install any user DB.
on:
  push:
    branches:
      - feature/ptj-three-visual-templates-2026-11-21
    paths:
      - .github/workflows/ptj-visual3-isolated-demo.yml

permissions:
  contents: read

jobs:
  visual3-isolated-demo:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Install locked frontend
        run: npm ci
      - name: Verify current three-template code regression tests
        run: npm test
      - name: Verify current TypeScript and production Vite build
        run: npm run build
      - name: Verify isolated Windows identity and local database path
        run: node scripts/verify-visual3-isolation.mjs
      - name: Reproduce original approved Windows app icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python scripts/build-approved-icon.py
      - name: Build one visual-template NSIS installer
        run: npm run tauri build -- --config src-tauri/tauri.visual3.conf.json --bundles nsis
      - name: Verify one EXE and exact SHA256
        shell: pwsh
        run: |
          $files = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' -ErrorAction SilentlyContinue)
          if ($files.Count -ne 1) { throw "Expected exactly 1 installer; found $($files.Count)" }
          if ($files[0].Name -notmatch '3 Visual Templates DEMO') { throw "Wrong installer name: $($files[0].Name)" }
          Write-Output "VerifiedFilename: $($files[0].Name)"
          Write-Output "VerifiedBytes: $($files[0].Length)"
          Get-FileHash -Path $files[0].FullName -Algorithm SHA256 | Format-List
      - name: Store one Windows demo candidate, never run installer
        uses: actions/upload-artifact@v4
        with:
          name: PTJ-3-VISUAL-TEMPLATES-ISOLATED-DEMO-UNTESTED
          path: app/src-tauri/target/release/bundle/nsis/*3 Visual Templates DEMO*.exe
          if-no-files-found: error
          retention-days: 7
