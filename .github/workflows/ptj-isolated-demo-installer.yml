name: PTJ Package A isolated Windows DEMO — consolidated gate
on:
  workflow_dispatch:
  push:
    branches:
      - build/package-a-cohesive-windows-demo-2026-11-08
    paths:
      - '.github/workflows/ptj-isolated-demo-installer.yml'
permissions:
  contents: read
concurrency:
  group: ptj-package-a-demo-${{ github.ref }}
  cancel-in-progress: false
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/verify-demo-config.mjs
  rust:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: node scripts/verify-demo-config.mjs
      - name: Resolve existing Rust lock on isolated runner
        working-directory: app/src-tauri
        run: cargo check
      - name: Verify native Rust with locked dependencies
        working-directory: app/src-tauri
        run: cargo check --locked
      - name: Run complete Rust library regression suite
        working-directory: app/src-tauri
        run: cargo test --locked --lib
  demo-installer:
    needs: [frontend, rust]
    if: ${{ needs.frontend.result == 'success' && needs.rust.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: npm ci
      - run: node scripts/verify-demo-config.mjs
      - name: Build ISOLATED DEMO only (no installation or production data access)
        run: npm run tauri build -- --config src-tauri/tauri.demo.conf.json --bundles nsis
      - name: Verify DEMO installer identity and compute SHA-256
        shell: pwsh
        run: |
          $files = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' -ErrorAction SilentlyContinue)
          if ($files.Count -ne 1) { throw "Expected exactly one DEMO installer; found $($files.Count)" }
          foreach ($file in $files) {
            if ($file.Name -notmatch 'DEMO') { throw "Refusing non-DEMO installer: $($file.Name)" }
            Write-Host "Installer: $($file.Name)"
            Write-Host "Bytes: $($file.Length)"
            Get-FileHash -Path $file.FullName -Algorithm SHA256 | Format-List
          }
      - uses: actions/upload-artifact@v4
        with:
          name: PTJ-PACKAGE-A-ISOLATED-DEMO-UNTESTED
          path: app/src-tauri/target/release/bundle/nsis/*DEMO*.exe
          if-no-files-found: error
          retention-days: 14
