name: PTJ Field Manager cohesive source checks (no installer)
on:
  workflow_dispatch:
  push:
    branches:
      - feature/ptj-settings-from-accepted-demo-2026-11-14
    paths:
      - .github/workflows/ptj-settings-icon-package-check.yml
      - app/src/App.tsx
      - app/src/fieldPreferenceVerification.ts
      - app/src/fieldPreferenceVerification.test.ts
      - app/src/customFieldRequired.ts
      - app/src/customFieldRequired.test.ts
      - app/src/customFieldReadOnly.ts
      - app/src/customFieldReadOnly.test.ts
      - app/src/customFieldOrderingCheck.ts
      - app/src/customFieldOrderingCheck.test.ts
      - app/src/customFieldLabelSafety.ts
      - app/src/customFieldLabelSafety.test.ts
      - app/src/customAdminValidation.ts
      - app/src/customAdminValidation.test.ts
      - app/src/customAdminRecovery.ts
      - app/src/customAdminRecovery.test.ts
      - app/src/customSelectionDraftSafety.ts
      - app/src/customSelectionDraftSafety.test.ts
      - app/src/customTypedDraftSafety.ts
      - app/src/customTypedDraftSafety.test.ts
      - app/src/customFieldWriteVerification.ts
      - app/src/customFieldWriteVerification.test.ts
      - app/src/fieldInventory.ts
      - app/src/fieldInventory.test.ts
      - app/src/fieldManagerSafety.test.ts
      - app/src/packageAContract.test.ts
      - app/scripts/build-approved-icon.py
      - app/src-tauri/icons/approved-teal-journal-source.webp.b64
      - app/src-tauri/icons/approved-icon-source.webp
      - app/src-tauri/src/custom_fields.rs
      - app/src-tauri/src/db.rs
      - app/src-tauri/src/repository.rs
      - app/src-tauri/migrations/**
permissions:
  contents: read
jobs:
  package-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify latest user-approved teal notebook artwork and generated transparent ICO
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          python3 scripts/build-approved-icon.py
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path('src-tauri/icons')
          ico=Image.open(p/'icon.ico').convert('RGBA')
          assert ico.getpixel((0,0))[3]==0, 'No transparent icon background'
          assert ico.getpixel((ico.width//2,ico.height//2))[3]>0, 'Artwork was deleted'
          png=Image.open(p/'128x128@2x.png').convert('RGBA')
          assert png.getpixel((0,0))[3]==0, 'Tauri PNG corner is opaque'
          print('Approved teal icon: alpha verified for Windows ICO and PNG transparent corners.')
          PY
      - name: No generated installer / artifact
        run: echo "CI-only gate, no NSIS installer and no uploaded artifact"

  rust-sqlite-contract:
    # The source-only package gate must also exercise the canonical native
    # custom-field and historical-value contract before the next installer.
    # Runs against ephemeral GitHub-hosted storage, never a user's journal DB.
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Resolve existing Rust lockfile on isolated CI runner only
        working-directory: app/src-tauri
        run: cargo check
      - name: Verify resolved Rust dependency lock on isolated runner
        working-directory: app/src-tauri
        run: cargo check --locked
      - name: Exercise native SQLite and custom-field regression tests
        working-directory: app/src-tauri
        run: cargo test --locked --lib
