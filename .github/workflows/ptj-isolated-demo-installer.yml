name: PTJ isolated DEMO installer (manual only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  demo-installer:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: npm ci
      - run: npm test
      - run: node scripts/verify-demo-config.mjs
      - name: Build DEMO only (never install into live data)
        run: npm run tauri build -- --config src-tauri/tauri.demo.conf.json --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: PTJ-ISOLATED-DEMO-UNTESTED
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
