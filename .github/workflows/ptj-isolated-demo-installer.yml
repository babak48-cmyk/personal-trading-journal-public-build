name: PTJ isolated DEMO installer (release gate)
# One isolated Windows acceptance candidate: in-app unsaved Evidence gate, readable history, shortcut registration visibility. Approved icon preserved.
on:
  workflow_dispatch:
  push:
    branches:
      - feature/review-mistakes-field-manager-2026-11-12
    paths:
      - .github/workflows/ptj-isolated-demo-installer.yml
      - app/src-tauri/icons/approved-icon-source.webp
      - app/src-tauri/tauri.conf.json
      - app/scripts/build-approved-icon.py
permissions:
  contents: read
jobs:
  demo-installer:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: npm ci
      - run: npm test
      - run: node scripts/verify-demo-config.mjs
      - name: Rebuild verified, user-approved Windows icon (no replacement art)
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python scripts/build-approved-icon.py
      - name: Verify approved icon is the configured installer and executable icon
        shell: pwsh
        run: |
          if (!(Test-Path src-tauri/icons/icon.ico)) { throw 'Approved icon.ico missing' }
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ($config.bundle.icon -notcontains 'icons/icon.ico') { throw 'EXE icon is not the approved ICO' }
          if ($config.bundle.windows.nsis.installerIcon -ne 'icons/icon.ico') { throw 'NSIS installer icon is not approved ICO' }
      - name: Build DEMO only (never install into live data)
        run: npm run tauri build -- --config src-tauri/tauri.demo.conf.json --bundles nsis
      - name: Verify isolated DEMO installer output
        shell: pwsh
        run: |
          $files = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' -ErrorAction SilentlyContinue)
          if ($files.Count -lt 1) { throw 'No Windows installer was built.' }
          foreach ($file in $files) {
            if ($file.Name -notmatch 'DEMO') { throw "Non-DEMO installer detected: $($file.Name)" }
            Get-FileHash -Path $file.FullName -Algorithm SHA256 | Format-List
          }
      - uses: actions/upload-artifact@v4
        with:
          name: PTJ-ISOLATED-DEMO-UNTESTED
          path: app/src-tauri/target/release/bundle/nsis/*DEMO*.exe
          if-no-files-found: error
          retention-days: 7
