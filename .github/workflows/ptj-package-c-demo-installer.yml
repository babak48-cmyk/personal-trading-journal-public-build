name: PTJ Package C isolated DEMO installer (one cohesive release gate)
# One authorized first Package C v10 installer build. Separate installer
# product and Tauri app identity from accepted main and prior DEMO.
on:
  workflow_dispatch:
  push:
    branches:
      - feature/ptj-package-c-audited-corrections-2026-11-15
    paths:
      - .github/workflows/ptj-package-c-demo-installer.yml
permissions:
  contents: read
jobs:
  package-c-demo:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/verify-package-c-isolation.mjs
      - name: Generate only the previously user-approved Windows icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python scripts/build-approved-icon.py
      - name: Check approved icon and distinct Package C product identity
        shell: pwsh
        run: |
          $base = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $demo = Get-Content src-tauri/tauri.demo.conf.json -Raw | ConvertFrom-Json
          $package = Get-Content src-tauri/tauri.packagec.conf.json -Raw | ConvertFrom-Json
          if ($base.identifier -eq $package.identifier -or $demo.identifier -eq $package.identifier) { throw 'Unsafe shared Package C app identity' }
          if ($package.identifier -ne 'com.personaltradingjournal.desktop.demo.packagec') { throw 'Unexpected Package C data path identity' }
          if ($base.bundle.icon -notcontains 'icons/icon.ico') { throw 'Approved executable icon not configured' }
          if ($base.bundle.windows.nsis.installerIcon -ne 'icons/icon.ico') { throw 'Approved installer icon not configured' }
      - name: Build entirely separate Package C DEMO (not a production install)
        run: npm run tauri build -- --config src-tauri/tauri.packagec.conf.json --bundles nsis
      - name: Verify the exact separate NSIS installer name and hash
        shell: pwsh
        run: |
          $files = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' -ErrorAction SilentlyContinue)
          if ($files.Count -ne 1) { throw "Expected exactly ONE Package C installer; got $($files.Count)" }
          if ($files[0].Name -notmatch 'Package C DEMO') { throw "Not the isolated Package C installer: $($files[0].Name)" }
          Get-FileHash -Path $files[0].FullName -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: PTJ-PACKAGE-C-ISOLATED-DEMO-UNTESTED
          path: app/src-tauri/target/release/bundle/nsis/*Package C DEMO*.exe
          if-no-files-found: error
          retention-days: 7
