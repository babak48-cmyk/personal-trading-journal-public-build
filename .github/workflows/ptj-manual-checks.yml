name: PTJ manual checks
on:
  workflow_dispatch:
  push:
    branches:
      - feature/package-a-evidence-decision-completion-2026-11-06
      - feature/ptj-package-a-cohesive-validation-repair-2026-11-18
    paths:
      - 'app/**'
      - '.github/workflows/ptj-manual-checks.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'app/**'
      - '.github/workflows/ptj-manual-checks.yml'
concurrency:
  group: ptj-manual-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Full frontend regression suite — cohesive Package A closure gate
        run: npm test
      - run: npm run build
      - run: node scripts/verify-demo-config.mjs
  rust:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Prepare Tauri frontendDist for cargo check
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: Resolve QW-1A Rust dependency lockfile (isolated runner only)
        working-directory: app/src-tauri
        run: cargo check
      - name: Verify Rust source with locked dependencies
        working-directory: app/src-tauri
        run: cargo check --locked
      - name: Targeted Package A native custom-field lifecycle regression tests
        working-directory: app/src-tauri
        run: 'cargo test --locked --lib custom_fields::tests::'
      - name: Native SQLite Evidence and Decision package regression tests
        working-directory: app/src-tauri
        run: |
          cargo test --locked --lib evidence_atomic_batch_tests::
          cargo test --locked --lib decision_mismatch_persistence_tests::
