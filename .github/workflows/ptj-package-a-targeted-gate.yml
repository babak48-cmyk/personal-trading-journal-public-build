name: PTJ Package A targeted source gate
on:
  push:
    branches:
      - feature/ptj-package-a-cohesive-validation-repair-2026-11-18
    paths:
      - '.github/workflows/ptj-package-a-targeted-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ptj-package-a-targeted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  custom-field-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Only changed custom-field and selection regression tests
        run: npx vitest run src/customSelectRequirement.test.ts src/customAdminValidation.test.ts src/customFieldWriteVerification.test.ts src/customSelectionDraftSafety.test.ts
      - name: TypeScript compile gate for shared application type safety
        run: npx tsc -b --pretty false

  custom-field-native:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Prepare Vite frontend only for native Tauri source check
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: Windows native compile check; no installer
        working-directory: app/src-tauri
        run: cargo check --locked
      - name: Native custom-field targeted tests on disposable in-memory SQLite only
        working-directory: app/src-tauri
        run: cargo test --locked --lib custom_fields::tests::
